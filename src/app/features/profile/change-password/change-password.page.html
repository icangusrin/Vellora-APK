<ion-content fullscreen class="password-content">

  <div class="password-header">

    <ion-icon
      name="arrow-back-outline"
      (click)="goBack()">
    </ion-icon>

    <h2>Ubah Password</h2>

  </div>

  <div class="password-form">

    <div class="input-group">

      <label>Password saat ini</label>

      <input
        type="password"
        [(ngModel)]="currentPassword"
      />

    </div>

    <div class="input-group">

      <label>Password baru</label>

      <input
        type="password"
        [(ngModel)]="newPassword"
      />

    </div>

    <div class="input-group">

      <label>Konfirmasi password baru</label>

      <input
        type="password"
        [(ngModel)]="confirmPassword"
      />

    </div>

    <button (click)="changePassword()">
      Konfirmasi
    </button>

  </div>

  <app-popup
    [show]="showSuccessPopup"
    [type]="'confirm'"
    [title]="'Sukses'"
    [message]="'Password anda telah diubah, silakan gunakan password baru saat login.'"
    [icon]="'shield-checkmark-outline'"
    [confirmText]="'Selesai'"
    (confirmed)="finishChangePassword()"
    (cancelled)="finishChangePassword()">
  </app-popup>

  <app-popup
    [show]="showErrorPopup"
    [type]="'notice'"
    [title]="'Gagal'"
    [message]="errorMessage"
    [icon]="'lock-closed-outline'"
    [confirmText]="'OK'"
    (confirmed)="closeErrorPopup()"
    (cancelled)="closeErrorPopup()">
  </app-popup>

</ion-content>
