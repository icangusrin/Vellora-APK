<ion-content fullscreen>
  <div class="laporkan-container">

    <div class="header">
      <ion-icon name="arrow-back-outline" (click)="goBack()"></ion-icon>
      <h2>Laporkan</h2>
    </div>

    <div class="form-section">
      
      <div class="input-group">
        <label>Jenis Laporan</label>
        <div class="select-box-wrapper" (click)="pilihJenisLaporan()">
          <span class="select-placeholder-text" [class.has-value]="selectedJenis">
            {{ selectedJenis ? selectedJenis : 'Pilih jenis laporan' }}
          </span>
          <svg class="select-arrow-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M6 9L12 15L18 9" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>

      <div class="input-group">
        <label>Judul Laporan</label>
<input
type="text"
[(ngModel)]="judulLaporan"
placeholder="Masukkan judul laporan"
class="custom-pure-input">      </div>

      <div class="input-group">
        <label>Deskripsi Laporan</label>
<textarea
rows="6"
[(ngModel)]="deskripsiLaporan"
placeholder="Jelaskan masalah yang terjadi secara detail"
class="custom-pure-textarea">
</textarea>      </div>

      <div class="input-group">
        <label>Foto Bukti (Opsional)</label>
        <div class="photo-scroll-container">
          <label class="upload-box">
            <input type="file" accept="image/*" multiple hidden (change)="onFileSelected($event)">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M23 19C23 19.5304 22.7893 20.0391 22.4142 20.4142C22.0391 20.7893 21.5304 21 21 21H3C2.46957 21 1.96086 20.7893 1.58579 20.4142C1.21071 20.0391 1 19.5304 1 19V8C1 7.46957 1.21071 6.96086 1.58579 6.58579C1.96086 6.21071 2.46957 6 3 6H7L9 3H15L17 6H21C21.5304 6 22.0391 6.21071 22.4142 6.58579C22.7893 6.96086 23 7.46957 23 8V19Z" stroke="#e56b7d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="12" cy="13" r="4" stroke="#e56b7d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </label>

          <div class="preview-list" *ngIf="previewImages && previewImages.length > 0">
            <div class="photo-preview-item" *ngFor="let img of previewImages">
              <img [src]="img">
            </div>
          </div>
        </div>
      </div>

      <div class="warning-box">
        <svg class="warning-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22Z" stroke="#bd4b5b" stroke-width="2"/>
          <path d="M12 8V12" stroke="#bd4b5b" stroke-width="2" stroke-linecap="round"/>
          <path d="M12 16H12.01" stroke="#bd4b5b" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span>Pastikan foto yg dikirim jelas dan menunjukkan masalah dengan baik</span>
      </div>

<button
class="submit-action-btn"
(click)="kirimLaporan()"
[disabled]="!selectedJenis || !judulLaporan || !deskripsiLaporan || isSubmitting">  Konfirmasi Laporan
</button>

    </div>
  </div>
</ion-content>
