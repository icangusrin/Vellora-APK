<ion-content fullscreen class="otp-content">

  <div class="otp-header">

    <ion-icon
      name="arrow-back-outline">
    </ion-icon>

    <h2>
      Ubah Email
    </h2>

  </div>

  <div class="otp-wrapper">

    <ion-icon
      name="mail-outline"
      class="mail-icon">
    </ion-icon>

    <p>
      Masukkan kode OTP yang kami
      kirim ke email baru anda
    </p>
    <div class="otp-inputs">

      <input maxlength="1" />
      <input maxlength="1" />
      <input maxlength="1" />
      <input maxlength="1" />

    </div>

    <div class="reset-code">
      Reset code
    </div>

  <button (click)="verifyOtp()">
    Verifikasi
  </button>

  </div>

</ion-content>
